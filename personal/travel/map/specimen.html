<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>戳章圖稿 — Eva Huang Travel Atlas</title>
  <link rel="icon" type="image/svg+xml" href="/writing/assets/2n-mark.svg">
  <link rel="stylesheet" href="/personal/travel/crumbs.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="/personal/travel/brand.css">
  <style>
    body{background:var(--paper)}
    .specimen{width:min(100% - 48px,1180px);margin:0 auto;padding:38px 0 70px}
    .specimen-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px 30px;border-bottom:1px solid var(--ng-line);padding:0 0 16px}
    .specimen-head h1{margin:0;font:900 clamp(30px,4.4vw,52px)/1.15 var(--ng-sans);letter-spacing:.03em}
    .specimen-head p{margin:10px 0 0;max-width:620px;font-size:11.5px;line-height:1.95;color:#87907f}
    .specimen-back{font:700 11px/1.4 var(--ng-grotesk);letter-spacing:.06em;color:var(--ng-red);text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(201,32,47,.35);padding-bottom:2px}
    .specimen-back:hover{text-decoration:underline}
    .scale-note{display:flex;align-items:center;gap:10px;margin:22px 0 0;font:600 10px/1.4 var(--mono);letter-spacing:.06em;color:#5c6a5e}
    .scale-note i{display:block;width:16px;height:16px;background:var(--stamp-ink)}
    .scale-note i:nth-of-type(1){opacity:1}.scale-note i:nth-of-type(2){opacity:.72}.scale-note i:nth-of-type(3){opacity:.44}.scale-note i:nth-of-type(4){opacity:.13}
    .kind-section{margin-top:38px}
    .kind-head{display:flex;align-items:baseline;gap:12px;margin:0 0 15px;padding-bottom:9px;border-bottom:1px solid var(--line)}
    .kind-head h2{margin:0;font:900 20px/1.35 var(--ng-sans);letter-spacing:.03em}
    .kind-head span{font:600 10px/1.4 var(--mono);letter-spacing:.1em;color:#8a9385}
    .specimen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
    .specimen-card{min-width:0;padding:12px 12px 13px;background:#fff;border:1px solid var(--ng-line);border-radius:var(--ng-r-sm)}
    .specimen-plate{display:grid;place-items:center;height:104px;background:var(--ng-paper);border:1px solid var(--ng-line);border-radius:6px}
    .specimen-plate svg{display:block;width:132px;height:77px;overflow:visible;fill:none;stroke:var(--stamp-ink);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
    .specimen-plate svg .t-1{opacity:1}.specimen-plate svg .t-2{opacity:.72}.specimen-plate svg .t-3{opacity:.44}.specimen-plate svg .f{fill:var(--stamp-ink);stroke:none}
    .specimen-card strong{display:block;margin:10px 0 2px;font:900 13.5px/1.45 var(--ng-sans);letter-spacing:.02em;overflow-wrap:anywhere}
    .specimen-card small{display:block;font:600 9px/1.6 var(--mono);letter-spacing:.03em;color:#8b9587;overflow-wrap:anywhere}
    @media(max-width:600px){.specimen{width:min(100% - 32px,1180px);padding:28px 0 50px}.specimen-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.specimen-plate svg{width:112px;height:65px}}
  </style>
  <script src="/personal/travel/navigation.js" defer></script>
</head>
<body class="ng-body">
  <nav class="crumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="/">Eva Huang</a></li>
      <li><a href="/personal/travel/">Travel</a></li>
      <li><a href="./">Stamp Atlas</a></li>
      <li aria-current="page">圖稿索引</li>
    </ol>
  </nav>
  <main class="specimen">
    <div class="specimen-head">
      <div><h1>戳章圖稿</h1><p>每個地點以當地著名的風景、花草、人物或建築入章，全部使用同一種墨色與四階色調。未列出的地點沿用所屬國家或地理分區的意象。</p></div>
      <a class="specimen-back" href="./">← 回蓋章地圖</a>
    </div>
    <div class="scale-note"><span>單色四階</span><i></i><i></i><i></i><i></i></div>
    <div id="specimen-groups"></div>
  </main>
  <script src="./world.js" defer></script>
  <script src="./places.js" defer></script>
  <script src="./us-states.js" defer></script>
  <script src="./stamp-art.js" defer></script>
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      const atlas = window.TravelAtlasStampArt;
      const world = window.TravelAtlasWorld;
      const places = window.TravelAtlasPlaces;
      const states = window.TravelAtlasStates;
      const host = document.getElementById('specimen-groups');
      if (!atlas || !host) return;
      const slug = text => text.normalize('NFKD').toLowerCase().replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const names = new Map();
      world.countries.forEach(c => { if (c.iso) names.set('iso:' + c.iso, c.zh); });
      places.cities.forEach(c => names.set('city:' + slug(c.en) + '-' + c.iso.toLowerCase(), c.zh));
      places.us.forEach(p => names.set('us:' + p[0], p[2]));
      places.ca.forEach(p => names.set('ca:' + p[0], p[2]));
      places.jp.forEach(p => names.set('jp:' + p[0], p[2]));
      states.forEach(s => names.set('state:' + s.abbr, s.zh));
      const tables = [
        [atlas.country, key => names.get('iso:' + key)],
        [atlas.city, key => names.get('city:' + key)],
        [atlas.usPark, key => names.get('us:' + key)],
        [atlas.caPark, key => names.get('ca:' + key)],
        [atlas.jpPark, key => names.get('jp:' + key)],
        [atlas.state, key => names.get('state:' + key)]
      ];
      const examples = new Map();
      tables.forEach(([table, translate]) => Object.entries(table).forEach(([key, motif]) => {
        const name = translate(key);
        if (!name) return;
        if (!examples.has(motif)) examples.set(motif, []);
        const list = examples.get(motif);
        if (list.length < 3 && !list.includes(name)) list.push(name);
      }));
      const groups = Object.fromEntries(atlas.kinds.map(k => [k, []]));
      Object.values(atlas.motifs).forEach(motif => groups[motif.kind]?.push(motif));
      const svgNS = 'http://www.w3.org/2000/svg';
      for (const [kind, motifs] of Object.entries(groups)) {
        if (!motifs.length) continue;
        const section = document.createElement('section');
        section.className = 'kind-section';
        const head = document.createElement('div');
        head.className = 'kind-head';
        const title = document.createElement('h2');
        title.textContent = kind;
        const count = document.createElement('span');
        count.textContent = `${motifs.length} 款`;
        head.append(title, count);
        const grid = document.createElement('div');
        grid.className = 'specimen-grid';
        motifs.forEach(motif => {
          const card = document.createElement('article');
          card.className = 'specimen-card';
          const plate = document.createElement('div');
          plate.className = 'specimen-plate';
          const svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('viewBox', '0 0 100 58');
          svg.setAttribute('aria-hidden', 'true');
          svg.innerHTML = atlas.render(motif);
          plate.append(svg);
          const label = document.createElement('strong');
          label.textContent = motif.label;
          const sample = document.createElement('small');
          sample.textContent = (examples.get(motif.id) || ['共用圖稿']).join('・');
          card.append(plate, label, sample);
          grid.append(card);
        });
        section.append(head, grid);
        host.append(section);
      }
    });
  </script>
</body>
</html>
