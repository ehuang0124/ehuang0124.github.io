<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive analysis of why work moved mid-sprint across six completed sprints.">
  <title>Why Scope Moved Mid-sprint — Agile Health Analytics</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f9fe;
      --surface: rgba(255, 255, 255, .96);
      --surface-2: #eef5fc;
      --fg: #032d60;
      --muted: #54698d;
      --border: #d5e4f3;
      --track: #e3edf7;
      --accent: #0176d3;
      --c1: #1b96ff;
      --c2: #fe9339;
      --c3: #2e844a;
      --c4: #9050e9;
      --c5: #dd7a01;
      --shadow: 0 10px 30px rgba(3, 45, 96, .09);
    }

    body.cb {
      --accent: #0072b2;
      --c1: #0072b2;
      --c2: #d55e00;
      --c3: #009e73;
      --c4: #cc79a7;
      --c5: #e69f00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(27, 150, 255, .15), transparent 30rem),
        radial-gradient(circle at 94% 8%, rgba(144, 80, 233, .11), transparent 26rem),
        var(--bg);
      color: var(--fg);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(1140px, calc(100% - 32px)); margin-inline: auto; }

    header {
      padding: 38px 0 26px;
      border-bottom: 1px solid rgba(1, 118, 211, .16);
      background: linear-gradient(115deg, rgba(255,255,255,.92), rgba(238,247,255,.82) 60%, rgba(246,239,255,.72));
    }
    .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 {
      margin: 0;
      font-size: clamp(31px, 5vw, 52px);
      line-height: 1.04;
      letter-spacing: -.045em;
      background: linear-gradient(90deg, #032d60 12%, #0b5cab 58%, #5a1ba9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .scope { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
    #cb {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.86);
      color: var(--fg);
      cursor: pointer;
      font-weight: 750;
    }
    #cb:hover, #cb:focus-visible { border-color: var(--accent); outline: none; }
    #cb[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }

    main { padding: 30px 0 54px; }
    h2 { margin: 0; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.03em; }
    h3 { margin: 0; font-size: clamp(24px, 3vw, 34px); line-height: 1.1; letter-spacing: -.035em; }
    .section-sub { margin: 5px 0 18px; color: var(--muted); }

    .buckets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .bucket {
      position: relative;
      overflow: hidden;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(247,251,255,.94));
      color: var(--fg);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }
    .bucket::after {
      content: "";
      position: absolute;
      inset: auto -34px -45px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      pointer-events: none;
    }
    .bucket:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 58%, var(--border)); }
    .bucket:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent); outline-offset: 3px; }
    .bucket[aria-pressed="true"] { border: 2px solid var(--accent); padding: 19px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 11%, transparent), 0 14px 36px rgba(1,118,211,.13); }
    .bucket-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .bucket-shape { font-size: 17px; font-weight: 900; }
    .bucket-count { color: var(--muted); font-size: 12px; font-weight: 750; }
    .bucket-value { display: block; margin-top: 13px; font-size: clamp(28px, 4vw, 42px); line-height: 1; font-weight: 880; letter-spacing: -.05em; }
    .bucket-label { display: block; min-height: 44px; margin-top: 7px; font-weight: 800; line-height: 1.25; }
    .mini-track { display: block; height: 7px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: var(--track); }
    .mini-fill { height: 100%; border-radius: inherit; }

    .detail {
      margin-top: 20px;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(243,249,255,.96));
      box-shadow: var(--shadow);
    }
    .detail-head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }
    .detail-kicker { display: inline-flex; margin: 0 0 10px; padding: 4px 9px; border-radius: 999px; color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, #fff); font-size: 11px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .detail-summary { max-width: 760px; margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .detail-share { text-align: right; }
    .detail-share strong { display: block; font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -.055em; }
    .detail-share span { color: var(--muted); font-size: 12px; font-weight: 750; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .metric { padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: linear-gradient(145deg, #f8fbff, var(--surface-2)); }
    .metric strong { display: block; font-size: 27px; line-height: 1; letter-spacing: -.03em; }
    .metric span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; font-weight: 720; }

    .breakdown { display: grid; gap: 15px; }
    .bar-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
    .bar-label { min-width: 0; font-weight: 750; }
    .bar-value { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 850; }
    .track { height: 18px; overflow: hidden; border-radius: 999px; background: var(--track); }
    .fill { height: 100%; border-radius: inherit; transition: width 380ms cubic-bezier(.2,.8,.2,1); }
    .c1 { background: var(--c1); }
    .c2 { background: var(--c2); }
    .c3 { background: var(--c3); }
    .c4 { background: var(--c4); }
    .c5 { background: var(--c5); }

    .analytic-note {
      margin-top: 22px;
      padding: 13px 15px;
      border-left: 5px solid var(--accent);
      border-radius: 0 14px 14px 0;
      background: color-mix(in srgb, var(--accent) 6%, #fff);
      color: var(--muted);
      font-size: 13px;
    }
    .analytic-note strong { color: var(--fg); }

    @media (max-width: 860px) {
      .buckets { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      header { padding-top: 26px; }
      .header-row { display: block; }
      #cb { margin-top: 16px; }
      .buckets { grid-template-columns: 1fr; }
      .bucket-label { min-height: 0; }
      .detail-head { grid-template-columns: 1fr; }
      .detail-share { text-align: left; }
      .metrics { grid-template-columns: 1fr 1fr 1fr; }
    }
    @media (max-width: 390px) {
      .shell { width: calc(100% - 20px); }
      .metrics { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bucket, .fill { transition: none; }
    }
    @media print {
      #cb { display: none; }
      .bucket, .detail { box-shadow: none; }
      body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell header-row">
      <div>
        <p class="eyebrow">✦ Agile health analytics</p>
        <h1>Why scope moved mid-sprint</h1>
        <p class="scope">Six completed sprints · 2026.07a–2026.09b · 133 movement events</p>
      </div>
      <button id="cb" type="button" aria-pressed="false" aria-label="Toggle colorblind-safe palette">Colorblind Mode</button>
    </div>
  </header>

  <main class="shell">
    <section aria-labelledby="reason-title">
      <h2 id="reason-title">Reason mix</h2>
      <p class="section-sub">Select a bucket to see what types of work moved within it.</p>
      <div class="buckets" id="buckets"></div>
    </section>

    <section class="detail" aria-live="polite" aria-labelledby="detail-title">
      <div class="detail-head">
        <div>
          <p class="detail-kicker" id="detail-kicker">Selected bucket</p>
          <h3 id="detail-title"></h3>
          <p class="detail-summary" id="detail-summary"></p>
        </div>
        <div class="detail-share"><strong id="detail-pct"></strong><span>of all movement</span></div>
      </div>
      <div class="metrics" id="metrics"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="analytic-note" id="analytic-note"></div>
    </section>

  </main>

  <script>
    const BUCKETS = [
      {
        id: "feature",
        shape: "◆",
        label: "Feature / customer",
        count: 69,
        pct: 51.9,
        added: 57,
        removed: 12,
        color: "c1",
        summary: "The largest movement bucket. Reliability/failover/safety and onboarding/environment enablement account for 53.6% of its events.",
        note: "Ask types were manually reviewed from each WI title and epic. They describe the work being moved, not a recorded cause for the timing.",
        details: [
          ["Reliability, failover & safety", 22],
          ["Onboarding & environment enablement", 15],
          ["Developer tooling & operations", 12],
          ["Release, deployment & migration", 11],
          ["Platform / API capability", 9]
        ]
      },
      {
        id: "bug",
        shape: "●",
        label: "Bug fix",
        count: 31,
        pct: 23.3,
        added: 30,
        removed: 1,
        color: "c2",
        summary: "Bug movement was almost entirely additive. Test/validation failures, runtime reliability, and routing/configuration defects account for 71.0% of this bucket.",
        note: "Bug subtypes were assigned from the defect subject and epic; repeated movement of the same WI remains counted as separate events.",
        details: [
          ["Test and validation failures", 8],
          ["Runtime reliability defects", 7],
          ["Routing and configuration correctness", 7],
          ["Monitoring, security & compliance", 6],
          ["Support and internal tooling", 3]
        ]
      },
      {
        id: "priority",
        shape: "▲",
        label: "Priority shift / uncoded",
        count: 28,
        pct: 21.1,
        added: 26,
        removed: 2,
        color: "c3",
        summary: "This is a residual bucket, not confirmed reprioritization. Release/test work and internal tooling represent 60.7% of the work themes inside it.",
        note: "Important: these are work themes, not reasons. The structured reason field was blank, so the analysis cannot establish why these 28 events occurred.",
        details: [
          ["Release, testing & cleanup", 10],
          ["Tooling and automation", 7],
          ["Cloud and environment delivery", 5],
          ["Planning and coordination", 3],
          ["Platform and reliability work", 3]
        ]
      },
      {
        id: "blocking",
        shape: "■",
        label: "Blocking lane / other",
        count: 5,
        pct: 3.8,
        added: 4,
        removed: 1,
        color: "c4",
        summary: "A small bucket concentrated in test prerequisites and explicit build blockers.",
        note: "Only three unique WIs produced these five movement events, so percentages in this bucket are directionally useful but statistically small.",
        details: [
          ["Prerequisite API / FIT enablement", 2],
          ["CD Stagger / UAP test support", 2],
          ["Explicit build blocker", 1]
        ]
      }
    ];

    const COLOR_CLASSES = ["c1", "c3", "c4", "c5", "c2"];
    const $ = id => document.getElementById(id);

    function pct(value, total) { return (value / total * 100).toFixed(1); }

    function renderBuckets() {
      $("buckets").innerHTML = BUCKETS.map((bucket, index) => `<button class="bucket" type="button" data-id="${bucket.id}" aria-pressed="${index === 0}">
        <span class="bucket-top"><span class="bucket-shape">${bucket.shape}</span><span class="bucket-count">${bucket.count} events</span></span>
        <span class="bucket-value">${bucket.pct.toFixed(1)}%</span>
        <span class="bucket-label">${bucket.label}</span>
        <span class="mini-track" aria-hidden="true"><span class="mini-fill ${bucket.color}" style="display:block;width:${bucket.pct / 55 * 100}%"></span></span>
      </button>`).join("");

      document.querySelectorAll(".bucket").forEach(button => {
        button.addEventListener("click", () => selectBucket(button.dataset.id));
      });
    }

    function selectBucket(id) {
      const bucket = BUCKETS.find(item => item.id === id);
      document.querySelectorAll(".bucket").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.id === id)));
      $("detail-kicker").textContent = `${bucket.shape} Selected reason bucket`;
      $("detail-title").textContent = bucket.label;
      $("detail-summary").textContent = bucket.summary;
      $("detail-pct").textContent = `${bucket.pct.toFixed(1)}%`;
      $("metrics").innerHTML = `<div class="metric"><strong>${bucket.count}</strong><span>Total movement events</span></div><div class="metric"><strong>${bucket.added}</strong><span>Added mid-sprint</span></div><div class="metric"><strong>${bucket.removed}</strong><span>Removed mid-sprint</span></div>`;

      const max = Math.max(...bucket.details.map(item => item[1]));
      $("breakdown").innerHTML = bucket.details.map((item, index) => `<div>
        <div class="bar-head"><span class="bar-label">${item[0]}</span><span class="bar-value">${pct(item[1], bucket.count)}% (${item[1]})</span></div>
        <div class="track" role="img" aria-label="${item[0]}: ${pct(item[1], bucket.count)} percent, ${item[1]} events"><div class="fill ${COLOR_CLASSES[index % COLOR_CLASSES.length]}" style="width:${item[1] / max * 100}%"></div></div>
      </div>`).join("");
      $("analytic-note").innerHTML = `<strong>Analytic note:</strong> ${bucket.note}`;
    }

    $("cb").addEventListener("click", () => {
      const on = document.body.classList.toggle("cb");
      $("cb").setAttribute("aria-pressed", String(on));
    });

    renderBuckets();
    selectBucket("feature");
  </script>
</body>
</html>
